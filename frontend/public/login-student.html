<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | MCQ Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/auth.css?v=3">
</head>

<body class="auth-body">


  <div class="bg-pattern"></div>
  <div class="floating-med-icons"></div>

  <!-- Unified Split Panel Layout -->
  <div class="auth-page-container">
    <!-- Graphic Illustration Panel -->
    <div class="auth-graphic-side">
      <div class="auth-graphic-content">
        <div class="auth-graphic-logo"><i class="fas fa-graduation-cap" style="color:white;"></i> MCQ<span>PRO</span></div>
        <div>
          <span class="role-badge"><i class="fas fa-user-graduate"></i> STUDENT PORTAL</span>
        </div>
        <h2 class="auth-graphic-title">Academic Portal</h2>
        <p class="auth-graphic-desc">Access exam modules, reports and personalized study insights securely.</p>
      </div>
      <div class="auth-graphic-image-container">
        <img src="/images/login-student.png" alt="Student Illustration" class="auth-graphic-image">
      </div>
    </div>

    <!-- Interactive Login Panel -->
    <div class="auth-form-side">
      <div class="auth-form-card">
        <div class="auth-form-card-inner">
          <div class="auth-tabs">
            <button onclick="toggleTab('login')" id="login-tab" class="auth-tab-btn active">
              <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <button onclick="toggleTab('register')" id="register-tab" class="auth-tab-btn">
              <i class="fas fa-user-plus"></i> Register
            </button>
          </div>

          <!-- Login Form -->
          <form id="login-form" onsubmit="handleLogin(event)">
            <div class="auth-input-group">
              <label><i class="far fa-envelope"></i> Email Address</label>
              <div class="auth-control-wrap">
                <input type="email" name="student_email" id="student_email" class="auth-control" placeholder="Enter your email" required autocomplete="username">
              </div>
            </div>
            <div class="auth-input-group">
              <label><i class="fas fa-lock"></i> Password</label>
              <div class="auth-control-wrap">
                <input type="password" name="student_password" id="student_password" class="auth-control" placeholder="Enter your password" required autocomplete="current-password">
                <i class="fas fa-eye" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#94a3b8; cursor:pointer;" onclick="this.previousElementSibling.type = this.previousElementSibling.type === 'password' ? 'text' : 'password'"></i>
              </div>
            </div>
            
            <div class="remember-forgot">
              <label><input type="checkbox" id="remember"> Remember me</label>
              <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-submit" id="login-btn">
              <span id="btn-text">Sign In to Exam Portal</span>
            </button>


          </form>

          <!-- Register Form -->
          <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
            <input type="hidden" name="role" value="student">
            <div class="auth-input-group">
              <label><i class="far fa-user"></i> Full Name</label>
              <div class="auth-control-wrap">
                <input type="text" name="name" class="auth-control" placeholder="Enter your full name" required>
              </div>
            </div>
            <div class="auth-input-group">
              <label><i class="far fa-envelope"></i> Email Address</label>
              <div class="auth-control-wrap">
                <input type="email" name="email" class="auth-control" placeholder="Enter your email" required>
              </div>
            </div>
            <div class="auth-input-group">
              <label><i class="fas fa-lock"></i> Password</label>
              <div class="auth-control-wrap">
                <input type="password" name="password" class="auth-control" minlength="8" placeholder="Create a password" required>
                <i class="fas fa-eye" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#94a3b8; cursor:pointer;" onclick="this.previousElementSibling.type = this.previousElementSibling.type === 'password' ? 'text' : 'password'"></i>
              </div>
            </div>

            <button type="submit" class="auth-submit mt-3" id="register-btn" style="margin-top:2rem;">
              <span id="reg-btn-text">Register Account</span>
            </button>
          </form>
        </div>

        <div class="form-footer">
          <div class="shield-icon">
            <i class="fas fa-shield-alt"></i> SafeExam Engine Active
          </div>
          <div class="shield-text">Your safety and privacy are our priority.</div>
        </div>
      </div>
    </div>
    
    <div class="absolute-footer">© 2025 MCQPRO. All rights reserved.</div>
  </div>

  <!-- Shared JS -->
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script src="/js/shared/notifications.js"></script>

  <script>
    function createFloatingIcons() {
      const icons = ['🎓', '📝', '✏️', '📖', '📚', '💡', '🎓', '🏫'];
      const container = document.querySelector('.floating-med-icons');
      if (!container) return;

      for (let i = 0; i < 8; i++) {
        const icon = document.createElement('div');
        icon.className = 'floating-icon';
        icon.innerHTML = icons[Math.floor(Math.random() * icons.length)];
        icon.style.top = `${Math.random() * 90}%`;
        icon.style.left = `${Math.random() * 90}%`;
        icon.style.fontSize = `${Math.random() * 20 + 16}px`;
        icon.style.animation = `float ${Math.random() * 10 + 10}s infinite ease-in-out`;
        container.appendChild(icon);
      }
    }

    function toggleTab(type) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const loginTab = document.getElementById('login-tab');
      const regTab = document.getElementById('register-tab');

      if (type === 'login') {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        loginTab.classList.add('active');
        regTab.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        loginTab.classList.remove('active');
        regTab.classList.add('active');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      
      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      btnText.innerHTML = '<div class="auth-spinner"></div> Authenticating...';

      const email = e.target.querySelector('input[type="email"]').value;
      const password = e.target.querySelector('input[type="password"]').value;

      try {
        await auth.login(email, password, 'student');
        notifications.success('Welcome back, Student!');
      } catch (err) {
        notifications.error(err.message || 'Login failed');
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        btnText.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to Exam Portal';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const registerBtn = document.getElementById('register-btn');
      const regBtnText = document.getElementById('reg-btn-text');
      
      registerBtn.disabled = true;
      registerBtn.classList.add('loading');
      regBtnText.innerHTML = '<div class="auth-spinner"></div> Registering...';

      const formData = new FormData(e.target);
      const userData = Object.fromEntries(formData);

      try {
        await auth.register(userData);
        notifications.success('Student account created successfully!');
        toggleTab('login');
      } catch (err) {
        notifications.error(err.message || 'Registration failed');
      } finally {
        registerBtn.disabled = false;
        registerBtn.classList.remove('loading');
        regBtnText.innerHTML = '<i class="fas fa-user-plus"></i> Create Student Account';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      createFloatingIcons();
      if (auth.isAuthenticated()) {
        const user = auth.getUser();
        if (user && user.role === 'student') {
          auth.redirectByRole('student');
        } else {
          // Clear mismatched session silently to prevent session bleed
          localStorage.removeItem('token');
          localStorage.removeItem('user');
        }
      }
    });
  </script>
</body>

</html>
