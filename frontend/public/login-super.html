<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Login | MCQ Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/auth.css?v=3">
</head>

<body class="auth-body">


  <div class="bg-pattern"></div>
  <div class="floating-med-icons"></div>

  <!-- Unified Split Panel Layout -->
  <div class="auth-page-container">
    <!-- Graphic Illustration Panel -->
    <div class="auth-graphic-side">
      <div class="auth-graphic-content">
        <div class="auth-graphic-logo"><i class="fas fa-crown" style="color:white;"></i> MCQ<span>PRO</span></div>
        <div>
          <span class="role-badge"><i class="fas fa-crown"></i> ADMIN PORTAL</span>
        </div>
        <h2 class="auth-graphic-title">Platform Administration</h2>
        <p class="auth-graphic-desc">Access secure controls to regulate school instances, billing plans, and audit system state changes.</p>
      </div>
      <div class="auth-graphic-image-container">
        <img src="/images/login-super.png" alt="Super Admin Illustration" class="auth-graphic-image">
      </div>
    </div>

    <!-- Interactive Login Panel -->
    <div class="auth-form-side">
      <div class="auth-form-card">
        <div class="auth-form-card-inner">
          <h2 class="auth-title"><i class="fas fa-sign-in-alt"></i> Login</h2>

          <form id="login-form" onsubmit="handleLogin(event)">
            <div class="auth-input-group">
              <label><i class="far fa-envelope"></i> Email Address</label>
              <div class="auth-control-wrap">
                <input type="email" name="super_admin_email" id="super_admin_email" class="auth-control" placeholder="Enter your email" required autocomplete="username">
              </div>
            </div>
            <div class="auth-input-group">
              <label><i class="fas fa-lock"></i> Password</label>
              <div class="auth-control-wrap">
                <input type="password" name="super_admin_password" id="super_admin_password" class="auth-control" placeholder="Enter your password" required autocomplete="current-password">
                <i class="fas fa-eye" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#94a3b8; cursor:pointer;" onclick="this.previousElementSibling.type = this.previousElementSibling.type === 'password' ? 'text' : 'password'"></i>
              </div>
            </div>
            
            <button type="submit" class="auth-submit" id="login-btn" style="margin-top: 1.5rem;">
              <span id="btn-text">Sign In to Platform</span>
            </button>
          </form>
        </div>

        <div class="form-footer">
          <div class="shield-icon">
            <i class="fas fa-shield-alt"></i> Blockchain Audit Guardian Active
          </div>
          <div class="shield-text">Your safety and privacy are our priority.</div>
        </div>
      </div>
    </div>
    
    <div class="absolute-footer">© 2025 MCQPRO. All rights reserved.</div>

  <!-- Shared JS -->
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script src="/js/shared/notifications.js"></script>

  <script>
    function createFloatingIcons() {
      const icons = ['👑', '⚡', '🔒', '🛡️', '⚙️', '📊', '🔑', '💻'];
      const container = document.querySelector('.floating-med-icons');
      if (!container) return;

      for (let i = 0; i < 8; i++) {
        const icon = document.createElement('div');
        icon.className = 'floating-icon';
        icon.innerHTML = icons[Math.floor(Math.random() * icons.length)];
        icon.style.top = `${Math.random() * 90}%`;
        icon.style.left = `${Math.random() * 90}%`;
        icon.style.fontSize = `${Math.random() * 20 + 16}px`;
        icon.style.animation = `float ${Math.random() * 10 + 10}s infinite ease-in-out`;
        container.appendChild(icon);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      
      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      btnText.innerHTML = '<div class="auth-spinner"></div> Authenticating...';

      const email = e.target.querySelector('input[type="email"]').value;
      const password = e.target.querySelector('input[type="password"]').value;

      try {
        await auth.login(email, password, 'super_admin');
        notifications.success('Welcome back, Administrator!');
      } catch (err) {
        alert(err.message || 'Invalid credentials');
        window.location.reload();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      createFloatingIcons();
      if (auth.isAuthenticated()) {
        const user = auth.getUser();
        if (user && user.role === 'super_admin') {
          auth.redirectByRole('super_admin');
        } else {
          // Clear mismatched session silently to prevent session bleed
          localStorage.removeItem('token');
          localStorage.removeItem('user');
        }
      }
    });
  </script>
</body>

</html>
